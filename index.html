<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aquarium met Effen Bruine Rand</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

/* Het frame vult exact 100% van de sign_01 */
.frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 28px solid #5c1d0b; /* Strakke effen bruine rand */
    box-shadow: 
        inset 0 0 15px rgba(0, 0, 0, 0.9),  /* Schaduw aan binnenkant voor diepte */
        0 0 10px rgba(0, 0, 0, 0.5);
    overflow: hidden;
}

/* Binnenste afwerklijst */
.frame::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border: 3px solid rgba(0, 0, 0, 0.6);
    z-index: 2;
    pointer-events: none;
}

/* YouTube Video Player */
#player {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%) scale(1.05); /* Iets opschalen tegen zwarte YouTube-randen */
    border: none;
    pointer-events: none;
    z-index: 1;
}
</style>
</head>

<body>

<div class="frame">
    <iframe
        id="player"
        src="https://www.youtube.com/embed/Hx770OPgMpw?autoplay=1&mute=1&controls=0&loop=1&playlist=Hx770OPgMpw&rel=0&modestbranding=1&fs=1"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
